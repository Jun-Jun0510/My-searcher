<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>a16z Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --bg:#EDF0F2;--paper:#FFFFFF;--ink:#17222D;--muted:#5B6874;--line:#D3D9DE;--hi:#FFF3D1;--kw:#9AA6B1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171E;--paper:#18222C;--ink:#E4EAEF;--muted:#94A2AE;--line:#2A3642;--hi:#2D2A1D;--kw:#6B7884;}}
:root[data-theme="dark"]{--bg:#10171E;--paper:#18222C;--ink:#E4EAEF;--muted:#94A2AE;--line:#2A3642;--hi:#2D2A1D;--kw:#6B7884;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
header{max-width:760px;margin:0 auto;padding:28px 20px 14px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
h1{font-size:clamp(24px,5.4vw,34px);line-height:1.35;margin:10px 0 0;font-weight:700;letter-spacing:.01em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);
  font:inherit;font-size:14px;padding:12px 10px 9px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab svg{width:24px;height:12px;flex:none}
.tab path{fill:none;stroke:var(--c);stroke-width:1.8;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--c)}
.tab:focus-visible{outline:2px solid var(--c);outline-offset:-3px}
.n{font-size:12px;font-weight:400;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:4px 20px 72px}
h2{font-size:18px;margin:34px 0 10px;display:flex;align-items:center;gap:10px}
h2::before{content:"";flex:none;width:16px;height:3px;border-radius:2px;background:var(--c)}
h3{font-size:16px;margin:20px 0 4px}
p{margin:0 0 8px}
ul{padding-left:22px;margin:0}
li{margin:6px 0}
.purpose{color:var(--muted);margin-top:22px}
.note{border-left:3px solid var(--c);padding:2px 0 2px 14px;margin-top:14px}
.skeptic{background:var(--hi);padding:14px 16px;border-radius:8px}
.rel{font-size:14px;color:var(--muted)}
.art{padding:14px 0;border-top:1px solid var(--line)}
.art:first-of-type{border-top:0}
.art a{font-weight:700;text-decoration:none}
.art a:hover{text-decoration:underline}
.src{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sci{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.sig{display:inline-flex;gap:2px;align-items:flex-end}
.sig i{width:3px;background:var(--line);border-radius:1px}
.sig i.on{background:var(--c)}
.sum{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:1px 11px;font-size:14px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13px}
.empty{color:var(--muted)}
.pill{font:inherit;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);
  border-radius:999px;padding:1px 12px;cursor:pointer}
.pill:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.pill[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:700}
.art .pill{margin-top:4px}
.detail{margin-top:10px;padding:12px 16px;background:var(--paper);border-radius:8px;font-size:15px}
.detail h4{font-size:13px;color:var(--muted);font-weight:500;margin:12px 0 2px}
.detail h4:first-child{margin-top:0}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px;color:var(--muted);white-space:nowrap}
.coh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.spark{width:67px;height:18px;flex:none;vertical-align:middle}
.spark polyline{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.graph .co circle{fill:var(--paper) !important;stroke:var(--ink);stroke-width:1.6}
.graph .co text{fill:var(--ink)}
.gtools{display:flex;gap:6px;margin-top:22px;align-items:center;flex-wrap:wrap}
.gtools .hint{font-size:13px;color:var(--muted);margin-left:auto}
.graph{background:var(--paper);border-radius:10px;margin-top:12px;overflow:hidden;touch-action:none}
.graph svg{display:block;width:100%}
.graph line{stroke:var(--line);stroke-width:1}
.graph .dim{opacity:.1}
.graph circle{cursor:pointer;stroke:var(--paper);stroke-width:1.5}
.graph text{font-size:11px;fill:var(--muted);stroke:var(--paper);stroke-width:3px;paint-order:stroke;pointer-events:none}
.graph .track text{font-size:13px;font-weight:700;fill:var(--ink)}
.graph .art text,.graph .kw.minor text{display:none}
.graph .show text{display:block !important;fill:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;border-radius:50%;background:var(--kw);vertical-align:middle;margin-right:5px}
.gpanel{margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
footer{max-width:760px;margin:0 auto;padding:0 20px 32px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="meta">
    <span>a16z Digest</span>
    <label>週 <select id="week" aria-label="表示する週"></select></label>
    <span id="period"></span>
  </div>
  <h1 id="title"></h1>
</header>
<nav><div class="tabs" id="tabs" role="tablist"></div></nav>
<main id="main" role="tabpanel"></main>
<footer>a16zは投資会社であり、記事には自社ポートフォリオへの利害が含まれ得ます。考察は自動生成です。</footer>

<script>
const D = __DATA__;
const INK = "var(--ink)";
const WAVES = [
  "M0 6 Q3 0 6 6 T12 6 T18 6 T24 6",
  "M0 9 V3 H6 V9 H12 V3 H18 V9 H24",
  "M0 9 L6 3 L12 9 L18 3 L24 9",
  "M0 9 L8 3 V9 L16 3 V9 L24 3",
  "M0 6 Q1.5 1 3 6 T6 6 T9 6 T12 6 T15 6 T18 6 T21 6 T24 6",
  "M0 9 H4 L6 2 L8 9 H14 L16 2 L18 9 H24",
  "M0 6 Q6 -2 12 6 T24 6",
  "M0 6 H5 V2 H9 V10 H13 V6 H24"
];
const FLAT = "M0 6 H24";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
let wi = 0;
let tab = (location.hash || "#all").slice(1);

function tabsFor(iss) {
  const arts = iss ? iss.articles : [];
  return [
    {id:"all", name:"総合", c:INK, w:FLAT},
    {id:"graph", name:"つながり", c:INK, w:"M2 10 L8 3 L15 8 L22 2 M8 3 L10 11"},
    {id:"co", name:"企業", c:INK, w:"M2 10 L6 8 L10 9 L14 5 L18 6 L22 2"},
    ...D.tracks.map((t, i) => ({id:"t"+i, name:t.name, c:t.color, w:WAVES[i % WAVES.length], track:t,
      arts: arts.filter(a => (a.interest_tags || []).includes(t.name))})),
    {id:"kw", name:"キーワード", c:INK, w:FLAT},
    {id:"pred", name:"予測ログ", c:INK, w:FLAT}
  ];
}

function sig(n) {
  n = Number(n) || 0;
  return `<span class="sig" title="signal ${n}/5">${[1,2,3,4,5].map(k =>
    `<i class="${k <= n ? "on" : ""}" style="height:${4 + k * 2}px"></i>`).join("")}</span>`;
}

const GROUP_LABEL = {science:"科学", engineering:"工学"};
const trackColor = name => (D.tracks.find(t => t.name === name) || {}).color || "var(--muted)";
function company(c) {
  const tags = (c.interest_tags || []).map(t =>
    `<span class="tag"><i class="dot" style="background:${trackColor(t)}"></i>${esc(t)}</span>`).join("");
  return `<div class="art"><b>${esc(c.name)}</b>
    <div class="src">${c.sector ? `<span>${esc(c.sector)}</span>` : ""}<span>掲載確認 ${esc(c.date)}</span></div>
    ${c.what_ja ? `<p class="sum">${esc(c.what_ja)}</p>` : ""}${tags ? `<p>${tags}</p>` : ""}</div>`;
}
const CLAIM = {prediction:"予測", observation:"観察", opinion:"意見"};
function detail(a) {
  const pm = new Set(a.portfolio_mentions || []);
  const claims = (a.claims || []).map(c => `<span class="tag">${CLAIM[c.type] || "主張"}</span>${esc(c.text_ja)}`
    + (c.horizon ? `（時期: ${esc(c.horizon)}）` : ""));
  const cos = (a.companies || []).map(c => esc(c) + (pm.has(c) ? " <span class=\"tag\">a16z投資先</span>" : ""));
  return (a.points_ja && a.points_ja.length ? `<h4>要点</h4>${list(a.points_ja.map(esc))}` : "")
    + (claims.length ? `<h4>主張</h4>${list(claims)}` : "")
    + (cos.length ? `<h4>言及企業</h4><p>${cos.join("、")}</p>` : "")
    + (a.keywords && a.keywords.length ? `<h4>キーワード</h4><div class="chips">${a.keywords.map(k => `<span>${esc(k)}</span>`).join("")}</div>` : "");
}

function art(a) {
  const d = detail(a);
  return `<div class="art">
    <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
    <div class="src"><span>${esc(a.source)}</span><span>${esc(a.date)}</span>
      ${GROUP_LABEL[a.group] ? `<span class="sci">${GROUP_LABEL[a.group]}</span>` : ""}${sig(a.signal)}</div>
    <p class="sum">${esc(a.summary_ja)}</p>
    ${d ? `<button class="pill more" aria-expanded="false">詳しく</button><div class="detail" hidden>${d}</div>` : ""}</div>`;
}

const byScore = arr => [...arr].sort((x, y) => (Number(y.signal) || 0) - (Number(x.signal) || 0));
const list = xs => xs && xs.length ? `<ul>${xs.map(x => `<li>${x}</li>`).join("")}</ul>` : "";
const sec = (t, body) => body ? `<h2>${t}</h2>${body}` : "";

function viewAll(iss) {
  const ed = iss.editorial, A = iss.articles;
  const themes = (ed.themes || []).map(t => {
    const rel = (t.articles || []).map(Number).filter(i => A[i])
      .map(i => `<a href="${esc(A[i].url)}" target="_blank" rel="noopener">${esc(A[i].title)}</a>`).join(" / ");
    return `<h3>${esc(t.title)}</h3><p>${esc(t.body)}</p>${rel ? `<p class="rel">関連: ${rel}</p>` : ""}`;
  }).join("");
  return sec("今週の3行", list((ed.tldr || []).map(esc)))
    + sec("テーマ考察", themes)
    + sec("新規投資先", (iss.new_portfolio || []).length
        ? (ed.portfolio_note ? `<p class="note" style="--c:var(--ink)">${esc(ed.portfolio_note)}</p>` : "")
          + iss.new_portfolio.map(company).join("")
        : "")
    + sec("懐疑メモ", ed.skeptic ? `<p class="skeptic">${esc(ed.skeptic)}</p>` : "")
    + sec("ウォッチリスト", list((ed.watch || []).map(esc)))
    + sec("注目記事", byScore(A).slice(0, 10).map(art).join(""));
}

function viewTrack(iss, T) {
  const note = ((iss.editorial.interest_cross) || []).find(c => c.tag === T.name);
  return `<p class="purpose">${esc(T.track.purpose)}</p>`
    + (note ? `<p class="note">${esc(note.note)}</p>` : "")
    + sec(`<span>記事 <span class="n">${T.arts.length}件</span></span>`, byScore(T.arts).map(art).join("")
      || `<p class="empty">この週はこのトラックに該当する記事がありません。キーワードは config.yaml の interests で調整できます。</p>`);
}

function spark(w) {
  const max = Math.max(1, ...w);
  const pts = w.map((v, i) => `${2 + i * 9},${16 - v / max * 13}`).join(" ");
  return `<svg class="spark" viewBox="0 0 67 18" role="img" aria-label="直近8週の推移"><polyline points="${pts}"/></svg>`;
}
const SRC_LABEL = {a16z:"a16z", science:"科学", engineering:"工学"};
function coCard(iss, c) {
  const arts = iss.articles.filter(a => (c.urls || []).includes(a.url));
  const links = arts.map(a => `<p><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
    <br><span class="src">${esc(a.source)}</span></p>`).join("");
  return `<div class="art"><div class="coh"><b>${esc(c.name)}</b>${spark(c.weekly || [])}</div>
    <div class="src"><span>今週 ${c.this_week}件</span><span>過去4週平均 ${c.avg_prev4w}</span>
      <span>${(c.groups || []).map(g => SRC_LABEL[g] || g).join("・")}</span>
      ${(c.reasons || []).map(r => `<span class="sci">${esc(r)}</span>`).join("")}</div>
    ${links ? `<button class="pill more" data-label="記事を見る" aria-expanded="false">記事を見る</button><div class="detail" hidden>${links}</div>` : ""}</div>`;
}
function viewCo(iss) {
  const C = iss.companies || {focus:[], ranking:[]}, ed = iss.editorial;
  const focus = (ed.company_note ? `<p class="note">${esc(ed.company_note)}</p>` : "")
    + (C.focus.length ? C.focus.map(c => coCard(iss, c)).join("")
      : `<p class="empty">この週は目立った動きのある企業はありません。</p>`);
  const rank = C.ranking.length ? `<div class="wrap"><table>
    <tr><th>企業</th><th>今週</th><th>直近8週</th><th></th></tr>
    ${C.ranking.map(c => `<tr><td>${esc(c.name)}</td><td>${c.this_week}</td><td>${spark(c.weekly || [])}</td>
      <td>${(c.reasons || []).includes("a16z投資先") ? '<span class="sci">投資先</span>' : ""}</td></tr>`).join("")}
    </table></div>` : "";
  return `<p class="purpose">記事に出てきた企業を集計しています。初登場・急上昇・複数ソースのいずれかに当てはまる企業を「動きのある企業」としています。</p>`
    + sec("動きのある企業", focus) + sec("言及ランキング", rank);
}

function viewKw(iss) {
  const tr = iss.trends || {new:[], rising:[]}, ed = iss.editorial;
  const signals = (ed.new_signals || []).map(s => `<b>${esc(s.keyword)}</b>　${esc(s.why)}`);
  const rising = tr.rising && tr.rising.length ? `<div class="wrap"><table>
    <tr><th>キーワード</th><th>今週</th><th>過去4週平均</th></tr>
    ${tr.rising.map(r => `<tr><td>${esc(r.keyword)}</td><td>${r.this_week}</td><td>${r.avg_prev4w}</td></tr>`).join("")}
    </table></div>` : `<p class="empty">急上昇の判定には過去4週分のデータが必要です。</p>`;
  return sec("注目の新出シグナル", list(signals))
    + sec("初登場キーワード", tr.new && tr.new.length ? `<div class="chips">${tr.new.map(k => `<span>${esc(k)}</span>`).join("")}</div>` : "")
    + sec("急上昇キーワード", rising);
}

function viewPred() {
  if (!D.predictions.length) return `<p class="empty" style="margin-top:24px">予測はまだ記録されていません。</p>`;
  return sec("記録された予測", D.predictions.map(p => `<div class="art">
    <p>${esc(p.claim)}</p>
    <div class="src"><span>${esc(p.date)}</span>${p.horizon ? `<span>時期: ${esc(p.horizon)}</span>` : ""}
    <a href="${esc(p.url)}" target="_blank" rel="noopener">出典</a></div></div>`).join(""));
}


// ---------- つながり（グラフ） ----------
let gScope = "week";
function scopeIssues() { return gScope === "week" ? [D.issues[wi]] : D.issues.slice(wi, wi + 8); }
function scopeArticles() {
  const m = new Map();
  scopeIssues().forEach(i => i.articles.forEach(a => { if (!m.has(a.url)) m.set(a.url, a); }));
  return [...m.values()];
}
function scopeNewPortfolio() {
  const m = new Map();
  scopeIssues().forEach(i => (i.new_portfolio || []).forEach(c => { if (!m.has(c.name)) m.set(c.name, c); }));
  return [...m.values()];
}

function buildGraph(arts, newp) {
  const nodes = new Map(), links = [];
  const add = (id, o) => { if (!nodes.has(id)) nodes.set(id, {id, deg:0, ...o}); return nodes.get(id); };
  D.tracks.forEach(t => add("T:" + t.name, {type:"track", label:t.name, color:t.color}));
  const cnt = {};
  arts.forEach(a => new Set(a.keywords || []).forEach(k => cnt[k] = (cnt[k] || 0) + 1));
  const minK = arts.length < 8 ? 1 : 2;
  const coCnt = {}, portfolio = new Set();
  arts.forEach(a => {
    new Set(a.companies || []).forEach(c => coCnt[c] = (coCnt[c] || 0) + 1);
    (a.portfolio_mentions || []).forEach(c => portfolio.add(c));
  });
  const newMap = new Map(newp.map(c => [c.name, c]));
  const coOK = c => portfolio.has(c) || newMap.has(c) || coCnt[c] >= 2;
  arts.forEach(a => {
    const tr = D.tracks.find(t => (a.interest_tags || []).includes(t.name));
    const an = add("A:" + a.url, {type:"art", label:a.title, color:tr ? tr.color : "var(--muted)", art:a});
    (a.interest_tags || []).forEach(t => { if (nodes.has("T:" + t)) links.push({source:an.id, target:"T:" + t}); });
    new Set(a.keywords || []).forEach(k => {
      if (cnt[k] < minK) return;
      add("K:" + k, {type:"kw", label:k});
      links.push({source:an.id, target:"K:" + k});
    });
    new Set(a.companies || []).forEach(c => {
      if (!coOK(c)) return;
      add("C:" + c, {type:"co", label:c, info:newMap.get(c)});
      links.push({source:an.id, target:"C:" + c});
    });
  });
  // 新規投資先は記事に出ていなくても、推定トラックにつないで表示する
  newp.forEach(c => {
    const cn = add("C:" + c.name, {type:"co", label:c.name, info:c});
    (c.interest_tags || []).forEach(t => { if (nodes.has("T:" + t)) links.push({source:cn.id, target:"T:" + t}); });
  });
  links.forEach(l => { nodes.get(l.source).deg++; nodes.get(l.target).deg++; });
  return {nodes:[...nodes.values()].filter(n => n.deg > 0), links};
}

function viewGraph() {
  return `<div class="gtools">
      <button class="pill scope" data-scope="week" aria-pressed="${gScope === "week"}">この週</button>
      <button class="pill scope" data-scope="all" aria-pressed="${gScope === "all"}">直近8週</button>
      <span class="hint">ドラッグで移動、ピンチで拡大</span></div>
    <div class="graph" id="graph"></div>
    <div class="legend"><span><i style="width:12px;height:12px;background:var(--ink)"></i>関心トラック</span>
      <span><i style="width:8px;height:8px;background:var(--muted)"></i>記事（色はトラック）</span>
      <span><i style="width:6px;height:6px"></i>キーワード</span>
      <span><i style="width:9px;height:9px;background:none;border:1.6px solid var(--ink)"></i>企業</span></div>
    <div class="gpanel" id="gpanel"><p class="empty" style="margin-top:14px">点をタップすると、つながっている記事がここに出ます。</p></div>`;
}

function drawGraph() {
  const el = $("graph");
  if (!el) return;
  if (!window.d3) { el.innerHTML = '<p class="empty" style="padding:16px">グラフの描画ライブラリを読み込めませんでした。通信状況を確認して再読み込みしてください。</p>'; return; }
  const {nodes, links} = buildGraph(scopeArticles(), scopeNewPortfolio());
  const W = el.clientWidth, H = Math.round(Math.max(420, Math.min(640, W * 1.35)));
  const r = n => n.type === "track" ? 8 + Math.sqrt(n.deg) * 2.2 : n.type === "art" ? 5 : n.type === "co" ? 5.5 : 2.5 + Math.sqrt(n.deg) * 1.4;
  const svg = d3.select(el).append("svg").attr("viewBox", [0, 0, W, H]).attr("height", H);
  const g = svg.append("g");
  const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", e => g.attr("transform", e.transform));
  svg.call(zoom);
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(l => l.target.type === "track" ? 80 : 38).strength(0.4))
    .force("charge", d3.forceManyBody().strength(n => n.type === "track" ? -380 : -60))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("x", d3.forceX(W / 2).strength(0.08 * H / W)).force("y", d3.forceY(H / 2).strength(0.08 * W / H))
    .force("collide", d3.forceCollide(n => r(n) + (n.type === "track" ? 14 : 4)));
  const link = g.append("g").selectAll("line").data(links).join("line");
  const node = g.append("g").selectAll("g").data(nodes).join("g")
    .attr("class", d => `node ${d.type}${d.type === "kw" && d.deg < 2 ? " minor" : ""}`);
  node.append("circle").attr("r", r).style("fill", d => d.type === "kw" ? "var(--kw)" : d.color);
  node.append("text").text(d => d.type === "art" && d.label.length > 28 ? d.label.slice(0, 27) + "…" : d.label)
    .attr("x", d => r(d) + 4).attr("y", 4);
  node.call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  const tick = () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  };
  // 先にレイアウトを計算してから全体が収まるようにズーム（毎回ぶれずに開く）
  sim.stop();
  for (let i = 0; i < 300; i++) sim.tick();
  tick();
  if (nodes.length) {
    const lw = n => n.type === "track" ? Math.min(90, n.label.length * 13) : 0;
    const x0 = Math.min(...nodes.map(n => n.x - r(n))) - 12, x1 = Math.max(...nodes.map(n => n.x + r(n) + 4 + lw(n))) + 12;
    const y0 = Math.min(...nodes.map(n => n.y)) - 24, y1 = Math.max(...nodes.map(n => n.y)) + 24;
    const k = Math.min(1.6, 0.96 * Math.min(W / (x1 - x0), H / (y1 - y0)));
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k));
  }
  sim.on("tick", tick);

  const clear = () => {
    node.classed("dim", false).classed("show", false); link.classed("dim", false);
    $("gpanel").innerHTML = '<p class="empty" style="margin-top:14px">点をタップすると、つながっている記事がここに出ます。</p>';
  };
  svg.on("click", e => { if (e.target.tagName === "svg") clear(); });
  node.on("click", (e, d) => {
    e.stopPropagation();
    const nb = new Set([d.id]);
    links.forEach(l => { if (l.source.id === d.id) nb.add(l.target.id); if (l.target.id === d.id) nb.add(l.source.id); });
    node.classed("dim", n => !nb.has(n.id)).classed("show", n => nb.has(n.id));
    link.classed("dim", l => l.source.id !== d.id && l.target.id !== d.id);
    const arts = d.type === "art" ? [d.art] : byScore(nodes.filter(n => n.type === "art" && nb.has(n.id)).map(n => n.art));
    const head = d.type === "art" ? "選択中の記事" : `<span>「${esc(d.label)}」につながる記事 <span class="n">${arts.length}件</span></span>`;
    const panel = $("gpanel");
    panel.style.setProperty("--c", d.type === "kw" ? "var(--kw)" : d.type === "co" ? "var(--ink)" : d.color);
    panel.innerHTML = (d.info ? sec("新規投資先", company(d.info)) : "")
      + (arts.length || !d.info ? sec(head, arts.map(art).join("")) : "");
  });
}

function render() {
  const iss = D.issues[wi];
  const tabs = tabsFor(iss);
  if (!tabs.some(t => t.id === tab)) tab = "all";
  const T = tabs.find(t => t.id === tab);
  $("tabs").innerHTML = tabs.map(t => `<button class="tab" role="tab" id="tab-${t.id}" data-id="${t.id}"
      aria-selected="${t.id === tab}" style="--c:${t.c}">
      <svg viewBox="0 0 24 12" aria-hidden="true"><path d="${t.w}"/></svg>${esc(t.name)}
      ${t.arts ? `<span class="n">${t.arts.length}</span>` : ""}</button>`).join("");
  $("main").style.setProperty("--c", T.c);
  $("main").setAttribute("aria-labelledby", "tab-" + T.id);
  if (!iss) {
    $("title").textContent = "まだ号がありません";
    $("main").innerHTML = `<p class="empty" style="margin-top:24px">python digest.py を実行すると最初の号が作られます。</p>`;
    return;
  }
  $("title").textContent = iss.editorial.subject || "今週のダイジェスト";
  $("period").textContent = iss.period;
  $("main").innerHTML = tab === "all" ? viewAll(iss) : tab === "graph" ? viewGraph() : tab === "co" ? viewCo(iss) : tab === "kw" ? viewKw(iss)
    : tab === "pred" ? viewPred() : viewTrack(iss, T);
  if (tab === "graph") drawGraph();
}

$("week").innerHTML = D.issues.map((x, i) => `<option value="${i}">${esc(x.date)}</option>`).join("");
$("week").onchange = e => { wi = Number(e.target.value); render(); };
$("tabs").onclick = e => {
  const b = e.target.closest(".tab");
  if (!b) return;
  tab = b.dataset.id;
  history.replaceState(null, "", "#" + tab);
  render();
  document.getElementById("tab-" + tab).scrollIntoView({block:"nearest", inline:"nearest"});
  window.scrollTo({top: 0});
};
$("tabs").onkeydown = e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ids = [...document.querySelectorAll(".tab")].map(b => b.dataset.id);
  const i = ids.indexOf(tab) + (e.key === "ArrowRight" ? 1 : -1);
  if (i < 0 || i >= ids.length) return;
  tab = ids[i]; history.replaceState(null, "", "#" + tab); render();
  document.getElementById("tab-" + tab).focus();
};
$("main").onclick = e => {
  const m = e.target.closest(".more");
  if (m) {
    const open = m.getAttribute("aria-expanded") === "true";
    m.setAttribute("aria-expanded", String(!open));
    m.textContent = open ? (m.dataset.label || "詳しく") : "閉じる";
    m.nextElementSibling.hidden = open;
    return;
  }
  const sc = e.target.closest(".scope");
  if (sc && sc.dataset.scope !== gScope) { gScope = sc.dataset.scope; render(); }
};
let rt, lastW = innerWidth;
addEventListener("resize", () => {
  if (tab !== "graph" || innerWidth === lastW) return;
  lastW = innerWidth; clearTimeout(rt);
  rt = setTimeout(() => { $("graph").innerHTML = ""; drawGraph(); }, 250);
});
render();
</script>
</body>
</html>
