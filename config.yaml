# 行動: ポートフォリオページ（週1で取得し、前回との差分で新規投資先を検出）
portfolio:
  url: https://a16z.com/portfolio/
  # CSSセレクタはページ構造を見て調整する（要確認）。JSで描画されるページなら取得方法ごと変更が必要
  item_selector: ".portfolio-company"   # 1社分の要素
  name_selector: ".name"                # その中の企業名
  sector_selector: ".category"          # その中の分野ラベル（任意）
